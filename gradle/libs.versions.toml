[versions]
activityCompose = "1.13.0"
agp = "9.3.0"
#noinspection UnusedVersionCatalogEntry
android-minSdk = "24"
#noinspection UnusedVersionCatalogEntry
android-app-minSdk = "26"
#noinspection UnusedVersionCatalogEntry
android-compileSdk = "37"
